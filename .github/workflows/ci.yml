name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build release app
        run: Scripts/build-remote-app.sh
