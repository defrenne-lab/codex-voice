name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Validate distribution guards
        run: |
          for script in Scripts/*.sh; do zsh -n "$script"; done
          zsh Scripts/test-distribution-guards.sh
      - name: Validate bundled skill
        run: |
          test -x skills/piloter-le-mac-mini/scripts/control_mac_mini.sh
          zsh -n skills/piloter-le-mac-mini/scripts/control_mac_mini.sh
      - name: Typecheck public-key release verifier
        run: swiftc -typecheck Scripts/verify-update-artifacts.swift
      - name: Build release app
        run: Scripts/build-remote-app.sh
